# EBFI Ops — one VPS, three containers. Start: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ebfi
      POSTGRES_USER: ebfi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebfi -d ebfi"]
      interval: 5s
      retries: 10
    # no ports: the database is reachable only from the api container

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://ebfi:${POSTGRES_PASSWORD}@db:5432/ebfi
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      COOKIE_SECURE: "true"
      UPLOAD_DIR: /data/uploads
      TZ: Asia/Kolkata
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_SITE_ID: ${MS_SITE_ID:-}
      MS_ROOT: ${MS_ROOT:-EBFI}
    volumes:
      - uploads:/data/uploads
      - ./import:/data/import:ro

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
