<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EBFI Ops" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="format-detection" content="telephone=no" />
    <title>EBFI Ops</title>
    <meta name="theme-color" content="#070b14" />
    <script>try { document.documentElement.dataset.theme = localStorage.getItem("ebfi.theme") || "dark"; } catch (e) { document.documentElement.dataset.theme = "dark"; }</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      // the ERP is laid out for the phone: no pinch or double-tap zoom (iOS ignores user-scalable=no on its own)
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
      // height of the iPhone status bar over the page. Home-screen apps on recent iOS draw it over the page while
      // reporting a zero safe area, so it is measured here and the page keeps clear of it (--sat).
      (function () {
        function sat() {
          var probe = document.createElement("div");
          probe.style.cssText = "position:fixed;top:0;height:0;padding-top:env(safe-area-inset-top);visibility:hidden";
          document.body.appendChild(probe);
          var env = parseFloat(getComputedStyle(probe).paddingTop) || 0;
          probe.remove();
          var standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
          var ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
          var top = env;
          if (!env && standalone && ios && window.innerHeight >= screen.height - 2) top = screen.height >= 812 ? 54 : 20;
          document.documentElement.style.setProperty("--sat", top + "px");
        }
        sat();
        window.addEventListener("resize", sat);
        window.addEventListener("orientationchange", function () { setTimeout(sat, 300); });
      })();
      document.addEventListener("touchmove", function (e) { if (e.scale && e.scale !== 1) e.preventDefault(); }, { passive: false });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
